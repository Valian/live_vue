name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: e2e

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # playwright_ex needs Elixir ~> 1.18
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore Elixir dependency cache
        uses: actions/cache@v6
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies (root)
        run: npm install

      # mix.lock pins the playwright_ex driver and so the browser revisions
      - name: Restore Playwright driver and browser cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/mix.lock') }}

      - name: Install E2E dependencies and browsers
        run: mix playwright.install chromium --with-deps

      # Up to two retries of the failed tests, as the `retries: 2` of Playwright Test. An empty
      # rerun (nothing failed but a module) must not pass.
      - name: Run E2E tests
        run: |
          npm run e2e:build
          set -o pipefail
          mix test || { [ $? -eq 2 ] && mix test --failed | tee "$RUNNER_TEMP/retry.log" && ! grep -q "There are no tests to run" "$RUNNER_TEMP/retry.log"; } || { [ $? -eq 2 ] && mix test --failed | tee "$RUNNER_TEMP/retry.log" && ! grep -q "There are no tests to run" "$RUNNER_TEMP/retry.log"; }

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results
